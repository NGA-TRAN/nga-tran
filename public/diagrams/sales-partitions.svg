<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Dimension and fact layout</title>
  <desc id="desc">A small unpartitioned products table next to sales files partitioned on timestamp and product_id.</desc>
  <rect width="980" height="430" fill="#f6f5fb"/>
  <text x="24" y="36" fill="#111" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Dimension and fact tables</text>
  <text x="24" y="64" fill="#6b4de6" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600">Small dim (products)</text>
  <text x="24" y="82" fill="#5c5c5c" font-family="Inter, Segoe UI, sans-serif" font-size="12">Not partitioned</text>
  <text x="456" y="64" fill="#6b4de6" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600">Very large fact (sales)</text>
  <text x="456" y="82" fill="#5c5c5c" font-family="Inter, Segoe UI, sans-serif" font-size="12">Partitioned by (ts, product_id)  -  sorted by (product_id, ts)</text>

  <g transform="translate(24,108)">
    <rect width="400" height="248" rx="8" fill="#fff" stroke="#ddd"/>
    <rect width="400" height="36" rx="8" fill="#6b4de6"/>
    <rect y="20" width="400" height="16" fill="#6b4de6"/>
    <text x="16" y="24" fill="#fff" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">product_id</text>
    <text x="112" y="24" fill="#fff" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">name</text>
    <text x="300" y="24" fill="#fff" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">category</text>
    <g fill="#222" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">
      <text x="16" y="64">1</text><text x="112" y="64">Espresso beans</text><text x="300" y="64">Grocery</text>
      <text x="16" y="96">2</text><text x="112" y="96">Pour-over kettle</text><text x="300" y="96">Kitchen</text>
      <text x="16" y="128">3</text><text x="112" y="128">Ceramic mug</text><text x="300" y="128">Kitchen</text>
      <text x="16" y="160">4</text><text x="112" y="160">Oat milk</text><text x="300" y="160">Grocery</text>
      <text x="16" y="200" fill="#888">...</text><text x="112" y="200" fill="#888">...</text><text x="300" y="200" fill="#888">...</text>
    </g>
  </g>

  <g transform="translate(456,118)" fill="none" stroke="#6b4de6" stroke-width="1.5">
    <line x1="40" y1="250" x2="480" y2="250"/>
    <line x1="40" y1="250" x2="40" y2="16"/>
    <polyline points="480,245 488,250 480,255"/>
    <polyline points="35,16 40,8 45,16"/>
    <rect x="60" y="36" width="176" height="80" rx="16"/>
    <rect x="264" y="36" width="176" height="80" rx="16"/>
    <rect x="60" y="140" width="176" height="80" rx="16"/>
    <rect x="264" y="140" width="176" height="80" rx="16"/>
  </g>
  <g transform="translate(456,118)" fill="#6b4de6" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    <text x="250" y="82" text-anchor="middle">...</text>
    <text x="250" y="186" text-anchor="middle">...</text>
    <text x="148" y="126" text-anchor="middle">...</text>
    <text x="352" y="126" text-anchor="middle">...</text>
    <text x="452" y="82">...</text>
    <text x="452" y="186">...</text>
  </g>
  <text x="948" y="382" fill="#6b4de6" font-family="Inter, Segoe UI, sans-serif" font-size="13" text-anchor="end">ts</text>
  <text x="482" y="251" fill="#6b4de6" font-family="Inter, Segoe UI, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 482 251)">product_id</text>
</svg>
