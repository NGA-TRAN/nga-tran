<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Distributed plan with two workers</title>
  <desc id="desc">The same plan on two workers. Each worker reads products and a slice of sales. A network shuffle on name and bin feeds the final aggregates.</desc>
  <rect width="920" height="560" fill="#f6f5fb"/>
  <text x="28" y="36" fill="#111" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Distributed plan (2 workers)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b4de6"/>
    </marker>
  </defs>

  <rect x="20" y="68" width="430" height="472" rx="22" fill="none" stroke="#6b4de6" stroke-width="1.4" stroke-dasharray="6 5"/>
  <rect x="470" y="68" width="430" height="472" rx="22" fill="none" stroke="#6b4de6" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="40" y="92" fill="#2563eb" font-family="Inter, Segoe UI, sans-serif" font-size="13">Worker 1</text>
  <text x="800" y="92" fill="#2563eb" font-family="Inter, Segoe UI, sans-serif" font-size="13">Worker 2</text>

  <g font-family="Inter, Segoe UI, sans-serif">
    <g id="ops">
      <g transform="translate(176,108)">
        <rect width="150" height="42" rx="3" fill="#cfcfcf"/>
        <text x="75" y="17" text-anchor="middle" font-size="12" fill="#111">Aggregate</text>
        <text x="75" y="33" text-anchor="middle" font-size="11" fill="#333">(name, bin)</text>
      </g>
      <g transform="translate(176,188)">
        <rect width="150" height="42" rx="3" fill="#cfcfcf"/>
        <text x="75" y="17" text-anchor="middle" font-size="12" fill="#111">Repartition</text>
        <text x="75" y="33" text-anchor="middle" font-size="11" fill="#333">(name, bin)</text>
      </g>
      <g transform="translate(176,268)">
        <rect width="150" height="42" rx="3" fill="#cfcfcf"/>
        <text x="75" y="17" text-anchor="middle" font-size="12" fill="#111">Join</text>
        <text x="75" y="33" text-anchor="middle" font-size="11" fill="#333">product_id</text>
      </g>
      <g transform="translate(48,348)">
        <rect width="132" height="42" rx="3" fill="#cfcfcf"/>
        <text x="66" y="17" text-anchor="middle" font-size="12" fill="#111">DataSource</text>
        <text x="66" y="33" text-anchor="middle" font-size="11" fill="#333">(products)</text>
      </g>
      <g transform="translate(176,348)">
        <rect width="150" height="42" rx="3" fill="#cfcfcf"/>
        <text x="75" y="17" text-anchor="middle" font-size="12" fill="#111">Aggregate</text>
        <text x="75" y="33" text-anchor="middle" font-size="11" fill="#333">(product_id, bin)</text>
      </g>
      <g transform="translate(176,418)">
        <rect width="150" height="42" rx="3" fill="#cfcfcf"/>
        <text x="75" y="17" text-anchor="middle" font-size="12" fill="#111">Projection</text>
        <text x="75" y="33" text-anchor="middle" font-size="11" fill="#333">(date_bin, ...)</text>
      </g>
      <g transform="translate(176,488)">
        <rect width="150" height="42" rx="3" fill="#cfcfcf"/>
        <text x="75" y="17" text-anchor="middle" font-size="12" fill="#111">DataSource</text>
        <text x="75" y="33" text-anchor="middle" font-size="11" fill="#333">(sales)</text>
      </g>
    </g>
    <use href="#ops" x="450"/>
  </g>

  <g fill="none" stroke="#6b4de6" stroke-width="1.25" marker-end="url(#arrow)">
    <line x1="214" y1="188" x2="214" y2="154"/>
    <line x1="288" y1="188" x2="288" y2="154"/>
    <line x1="214" y1="268" x2="214" y2="234"/>
    <line x1="288" y1="268" x2="288" y2="234"/>
    <line x1="214" y1="348" x2="214" y2="314"/>
    <line x1="288" y1="348" x2="288" y2="314"/>
    <line x1="214" y1="418" x2="214" y2="394"/>
    <line x1="288" y1="418" x2="288" y2="394"/>
    <line x1="214" y1="488" x2="214" y2="464"/>
    <line x1="288" y1="488" x2="288" y2="464"/>
    <line x1="114" y1="348" x2="176" y2="304"/>

    <line x1="664" y1="188" x2="664" y2="154"/>
    <line x1="738" y1="188" x2="738" y2="154"/>
    <line x1="664" y1="268" x2="664" y2="234"/>
    <line x1="738" y1="268" x2="738" y2="234"/>
    <line x1="664" y1="348" x2="664" y2="314"/>
    <line x1="738" y1="348" x2="738" y2="314"/>
    <line x1="664" y1="418" x2="664" y2="394"/>
    <line x1="738" y1="418" x2="738" y2="394"/>
    <line x1="664" y1="488" x2="664" y2="464"/>
    <line x1="738" y1="488" x2="738" y2="464"/>
    <line x1="564" y1="348" x2="626" y2="304"/>

    <line x1="326" y1="188" x2="700" y2="154"/>
    <line x1="776" y1="188" x2="326" y2="154"/>
  </g>
  <g fill="#6b4de6" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    <text x="245" y="174" text-anchor="middle">...</text>
    <text x="245" y="254" text-anchor="middle">...</text>
    <text x="258" y="334" text-anchor="middle">...</text>
    <text x="245" y="409" text-anchor="middle">...</text>
    <text x="245" y="479" text-anchor="middle">...</text>
    <text x="695" y="174" text-anchor="middle">...</text>
    <text x="695" y="254" text-anchor="middle">...</text>
    <text x="708" y="334" text-anchor="middle">...</text>
    <text x="695" y="409" text-anchor="middle">...</text>
    <text x="695" y="479" text-anchor="middle">...</text>
  </g>
</svg>
