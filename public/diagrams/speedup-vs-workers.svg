<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
<title id="title">Speedup versus node count</title>
<desc id="desc">Speedup grows with worker count. Longer historical ranges stay closer to ideal linear scaling.</desc>
<rect width="860" height="500" fill="#f6f5fb"/>
<text x="28" y="36" fill="#111" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Speedup vs. workers</text>
<text x="28" y="58" fill="#444" font-family="Inter, Segoe UI, sans-serif" font-size="13">Speedup = single-node time / N-worker time. Dashed line is ideal linear scaling.</text>
<line x1="78" y1="400.0" x2="820" y2="400.0" stroke="#e3e0ee" stroke-width="1"/>
<text x="68" y="404.0" text-anchor="end" fill="#5c5c5c" font-family="Inter, Segoe UI, sans-serif" font-size="12">0x</text>
